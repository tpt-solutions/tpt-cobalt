[package]
name = "tpt-fusion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fusion (FPGA) backend: HLS kernel artifact emission, memory-fit proofs, and vendor toolchain manifests from Catalyst IR"
readme = "README.md"
keywords = ["fpga", "hls", "fpga-synthesis", "codegen"]
categories = ["compilers", "hardware-support"]

[dependencies]
tpt-catalyst = { workspace = true }
tpt-telos-uir-bridge = { workspace = true, features = ["uir"] }
tpt-uir-core = { workspace = true }
tpt-ml = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
