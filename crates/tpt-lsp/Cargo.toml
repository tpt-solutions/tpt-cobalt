[package]
name = "tpt-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TPT Script language server: tensor-aware diagnostics, hover, and completions (LSP 3.17 over stdio)"
readme = "README.md"
keywords = ["lsp", "language-server", "tpt-script"]
categories = ["development-tools"]

[dependencies]
tpt-lang = { workspace = true }
tower-lsp = { workspace = true }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[[bin]]
name = "tpt-lsp"
path = "src/bin/tpt-lsp.rs"
