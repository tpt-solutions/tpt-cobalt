[package]
name = "tpt-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime and system layer: 3-tier allocator, liveness-aware buffer pool, kernel dispatch, and dual-stream execution with event barriers"
readme = "README.md"
keywords = ["allocator", "memory-pool", "async", "runtime", "dispatch"]
categories = ["memory-management", "concurrency"]

[dependencies]
tpt-tensor = { workspace = true }
tpt-autograd = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
cust = { workspace = true, optional = true }

[features]
default = []
# CUDA backend (Driver API via `cust`). Optional so the default workspace
# build stays green on machines without a CUDA toolkit on the link path;
# the PTX artifact is embedded, so *running* only needs the driver.
cuda = ["dep:cust"]
