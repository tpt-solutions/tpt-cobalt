[package]
name = "tpt-tensor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device-agnostic, zero-copy tensor type with dtype dispatch, layouts, and CPU storage — the foundation of the tpt-cobalt ML stack"
readme = "README.md"
keywords = ["tensor", "machine-learning", "autograd", "numerical", "arrays"]
categories = ["data-structures", "science", "algorithms"]

[dependencies]
thiserror = { workspace = true }

# Boundary bridge (spec §5.1): tpt-tensor consumes tpt-math-linalg for CPU math.
# No internal rewrites — pure conversion at the boundary.
tpt-math-linalg = { path = "../../forked/tpt-math/crates/tpt-math-linalg" }
