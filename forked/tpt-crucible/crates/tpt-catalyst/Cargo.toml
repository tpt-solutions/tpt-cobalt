[package]
name = "tpt-catalyst"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TPT Catalyst — Core IR compiler for AI model ingestion"

[features]
default = []
mlir = ["dep:melior"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
anyhow = { version = "1" }
thiserror = { version = "2" }
tracing = { version = "0.1" }
sha2 = { version = "0.10" }
zip = { version = "2" }
melior = { version = "0.15", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
