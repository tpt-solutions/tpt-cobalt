[package]
name = "tpt-phys-thermal-struct"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Thermal expansion and thermo-mechanical stress coupling (FEM to FEM) for tpt-physics."
repository = "https://github.com/tpt-solutions/tpt-physics"
homepage = "https://github.com/tpt-solutions/tpt-physics"
readme = "README.md"
keywords = ["thermal", "structural", "multiphysics", "coupling", "fem"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
tpt-fem-mesh = { path = "../../../tpt-fem/crates/tpt-fem-mesh" }
tpt-fem-thermal = { path = "../../../tpt-fem/crates/tpt-fem-thermal" }
tpt-fem-elasticity = { path = "../../../tpt-fem/crates/tpt-fem-elasticity" }
tpt-phys-core = { path = "../tpt-phys-core" }
tracing = { version = "0.1" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
