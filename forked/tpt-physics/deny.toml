# cargo-deny configuration for tpt-physics.
#
# tpt-physics is strictly dual MIT / Apache-2.0. Any copyleft (GPL/LGPL/AGPL)
# or source-available (SSPL) dependency is rejected outright, protecting
# commercial viability for TPT Solutions and downstream users.

[advisories]
version = 2
yanked = "warn"
# bincode 1.3.3 is flagged "unmaintained", but upstream considers it a complete,
# final release with no safe upgrade path; tpt-phys-dem relies on it for
# checkpoint/resume, so the advisory is acknowledged and ignored.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
version = 2
# Only these permissive licenses are permitted.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
# Reject copyleft and source-available licenses.
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
# Crates may come from crates.io or the TPT Solutions git org.
#
# Sibling crates (`tpt-math`, `tpt-fem`, `tpt-science`) are pulled in as local
# path dependencies via `[workspace.dependencies]` — path/localhost sources are
# permitted by cargo-deny without an explicit allow entry. The git orgs below
# are listed so a future switch to git deps (or the published `tpt-science`
# `tpt-sci-sim-core`) is already allow-listed.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/tpt-solutions/tpt-math",
    "https://github.com/tpt-solutions/tpt-fem",
    "https://github.com/tpt-solutions/tpt-science",
]
