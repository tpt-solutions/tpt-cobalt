[package]
name = "tpt-for-typestate"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Type-level safety encoding toolkit: phantom/ghost/newtype/bounded/safe-cast."

readme = "README.md"
keywords = ["typestate", "type-level", "phantom-type", "newtype", "safety"]
categories = ["rust-patterns", "no-std"]

[dependencies]

[features]
default = ["std"]
std = []
alloc = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = "warn" }

[[example]]
name = "typestate_basic"
path = "examples/file_state_machine.rs"

