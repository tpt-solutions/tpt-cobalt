[package]
name = "tpt-for-refinement"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Refinement types: values carrying a compile-time refinement predicate."

readme = "README.md"
keywords = ["refinement-types", "contract", "dependent-types", "type-level", "predicate"]
categories = ["rust-patterns", "no-std"]

[dependencies]
tpt-for-contract = { path = "../tpt-for-contract", version = "0.1.0" }

[features]
default = ["std"]
std = []
alloc = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = "warn" }

[[example]]
name = "refinement_basic"
path = "examples/port_refinement.rs"

