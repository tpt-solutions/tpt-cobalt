[package]
name = "tpt-fem-quadrature"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Gauss quadrature rules for reference finite elements (line/tri/quad/tet/hex)."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["finite-element", "gauss-quadrature", "quadrature", "fem", "scientific-computing"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }

