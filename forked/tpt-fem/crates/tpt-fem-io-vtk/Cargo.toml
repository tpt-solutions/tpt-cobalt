[package]
name = "tpt-fem-io-vtk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "ParaView-compatible VTK result export for tpt-fem (via vtkio)."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["vtk", "paraview", "visualization", "fem", "mesh"]
categories = ["visualization", "science", "graphics"]

[dependencies]
tpt-fem-mesh = { path = "../tpt-fem-mesh", version = "0.1.0" }
vtkio = "0.6"

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }

