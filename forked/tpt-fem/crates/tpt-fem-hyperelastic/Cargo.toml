[package]
name = "tpt-fem-hyperelastic"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Hyperelastic constitutive models (Neo-Hookean, Mooney-Rivlin, Ogden) for tpt-fem."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["finite-element", "fem", "hyperelastic", "neo-hookean", "soft-tissue"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
tpt-fem-solve = { path = "../tpt-fem-solve", version = "0.1.0" }
tpt-fem-sparse = { path = "../tpt-fem-sparse", version = "0.1.0" }
tpt-fem-mesh = { path = "../tpt-fem-mesh", version = "0.1.0" }

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }
