[package]
name = "tpt-fem-eigen"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Sparse eigenvalue solvers (power iteration, shift-invert, Lanczos) for tpt-fem."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["eigenvalue", "lanczos", "sparse", "fem", "linear-algebra"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-fem-sparse = { path = "../tpt-fem-sparse", version = "0.1.0" }

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }

