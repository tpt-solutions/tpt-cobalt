[package]
name = "tpt-fem-element"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Reference elements, Lagrange shape functions, and isoparametric Jacobian mapping."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["finite-element", "shape-functions", "lagrange", "isoparametric", "fem"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-fem-quadrature = { path = "../tpt-fem-quadrature", version = "0.1.0" }

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }

