[package]
name = "tpt-fem-elasticity"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Linear elasticity (bar, plane-stress, plane-strain, 3D continuum) for tpt-fem."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["finite-element", "elasticity", "solid-mechanics", "fem", "structural-analysis"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
tpt-fem-assembly = { path = "../tpt-fem-assembly", version = "0.1.0" }
tpt-fem-sparse = { path = "../tpt-fem-sparse", version = "0.1.0" }
tpt-fem-element = { path = "../tpt-fem-element", version = "0.1.0" }
tpt-fem-mesh = { path = "../tpt-fem-mesh", version = "0.1.0" }
tpt-fem-quadrature = { path = "../tpt-fem-quadrature", version = "0.1.0" }
tpt-fem-eigen = { path = "../tpt-fem-eigen", version = "0.1.0" }

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }

