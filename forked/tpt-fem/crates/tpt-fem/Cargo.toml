[package]
name = "tpt-fem"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Umbrella crate re-exporting tpt-fem core crates behind Cargo features."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["finite-element", "fem", "scientific-computing", "simulation", "hpc"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
thiserror = "1"
toml = "0.8"
tpt-fem-quadrature = { path = "../tpt-fem-quadrature", version = "0.1.0", optional = true }
tpt-fem-element = { path = "../tpt-fem-element", version = "0.1.0", optional = true }
tpt-fem-mesh = { path = "../tpt-fem-mesh", version = "0.1.0", optional = true }
tpt-fem-sparse = { path = "../tpt-fem-sparse", version = "0.1.0", optional = true }
tpt-fem-assembly = { path = "../tpt-fem-assembly", version = "0.1.0", optional = true }
tpt-fem-thermal = { path = "../tpt-fem-thermal", version = "0.1.0", optional = true }
tpt-fem-io-vtk = { path = "../tpt-fem-io-vtk", version = "0.1.0", optional = true }
tpt-fem-elasticity = { path = "../tpt-fem-elasticity", version = "0.1.0", optional = true }
tpt-fem-solve = { path = "../tpt-fem-solve", version = "0.1.0", optional = true }
tpt-fem-eigen = { path = "../tpt-fem-eigen", version = "0.1.0", optional = true }
tpt-fem-io-abaqus = { path = "../tpt-fem-io-abaqus", version = "0.1.0", optional = true }
tpt-fem-io-exodus = { path = "../tpt-fem-io-exodus", version = "0.1.0", optional = true }
tpt-fem-mesh-gen = { path = "../tpt-fem-mesh-gen", version = "0.1.0", optional = true }
tpt-fem-dofmap = { path = "../tpt-fem-dofmap", version = "0.1.0", optional = true }
tpt-fem-dynamic = { path = "../tpt-fem-dynamic", version = "0.1.0", optional = true }
tpt-fem-plasticity = { path = "../tpt-fem-plasticity", version = "0.1.0", optional = true }
tpt-fem-hyperelastic = { path = "../tpt-fem-hyperelastic", version = "0.1.0", optional = true }
tpt-fem-composite = { path = "../tpt-fem-composite", version = "0.1.0", optional = true }
tpt-fem-porous = { path = "../tpt-fem-porous", version = "0.1.0", optional = true }
tpt-fem-contact = { path = "../tpt-fem-contact", version = "0.1.0", optional = true }
tpt-fem-fluid = { path = "../tpt-fem-fluid", version = "0.1.0", optional = true }
tpt-fem-coupling = { path = "../tpt-fem-coupling", version = "0.1.0", optional = true }

[features]
default = ["quadrature", "element", "mesh", "sparse", "assembly", "thermal", "io-vtk", "elasticity", "solve", "eigen", "io-abaqus", "io-exodus", "mesh-gen"]
# Phase 12 (advanced materials / contact / multiphysics) crates are experimental
# and deliberately NOT enabled by default.
quadrature = ["dep:tpt-fem-quadrature"]
element = ["dep:tpt-fem-element"]
mesh = ["dep:tpt-fem-mesh"]
sparse = ["dep:tpt-fem-sparse"]
assembly = ["dep:tpt-fem-assembly"]
thermal = ["dep:tpt-fem-thermal"]
io-vtk = ["dep:tpt-fem-io-vtk"]
elasticity = ["dep:tpt-fem-elasticity"]
solve = ["dep:tpt-fem-solve"]
eigen = ["dep:tpt-fem-eigen"]
io-abaqus = ["dep:tpt-fem-io-abaqus"]
io-exodus = ["dep:tpt-fem-io-exodus"]
mesh-gen = ["dep:tpt-fem-mesh-gen"]
dofmap = ["dep:tpt-fem-dofmap"]
dynamic = ["dep:tpt-fem-dynamic"]
plasticity = ["dep:tpt-fem-plasticity"]
hyperelastic = ["dep:tpt-fem-hyperelastic"]
composite = ["dep:tpt-fem-composite"]
porous = ["dep:tpt-fem-porous"]
contact = ["dep:tpt-fem-contact"]
fluid = ["dep:tpt-fem-fluid"]
coupling = ["dep:tpt-fem-coupling"]
# Optional MUMPS/UMFPACK sparse-direct backend (large-scale solves). Forwards
# to `tpt-fem-sparse`'s `russell` feature; requires the SuiteSparse/MUMPS
# toolchain (see `russell_sparse`), so it is never enabled by default.
russell = ["tpt-fem-sparse/russell"]

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }

