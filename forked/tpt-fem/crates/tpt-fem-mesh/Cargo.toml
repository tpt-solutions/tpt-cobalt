[package]
name = "tpt-fem-mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Mesh data structures, DOF numbering, and Gmsh .msh v4.1 import (via mshio)."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["finite-element", "mesh", "gmsh", "dof-numbering", "fem"]
categories = ["data-structures", "science", "mathematics"]

[dependencies]
mshio = "0.4"
tpt-fem-element = { path = "../tpt-fem-element", version = "0.1.0" }

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn" }
clippy = { all = { level = "warn", priority = -1 }, excessive_precision = "allow", needless_range_loop = "allow", too_many_arguments = "allow" }

