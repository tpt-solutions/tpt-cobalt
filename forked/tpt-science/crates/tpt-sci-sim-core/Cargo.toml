[package]
name = "tpt-sci-sim-core"
description = "Multi-scale simulation orchestration for the tpt-science pillar (time-stepping, cross-scale coupling, checkpointing)"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-science"
homepage = "https://github.com/tpt-solutions/tpt-science"
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-sim-core"
keywords = ["simulation", "multi-scale", "orchestration", "science"]
categories = ["science", "simulation"]
publish = false

[dependencies]
tpt-sci-ode = { path = "../tpt-sci-ode", version = "0.1.0" }
tpt-sci-grid = { path = "../tpt-sci-grid", version = "0.1.0" }
tpt-math-linalg = { version = "0.1.0" }
thiserror = { version = "2" }

[dev-dependencies]
# For the multi-scale cookbook example (reaction network -> sim-core coupling).
tpt-sci-reaction-network = { version = "0.1.0", path = "../tpt-sci-reaction-network" }
approx = { version = "0.5" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "allow" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }

[package.metadata.docs.rs]
all-features = true
