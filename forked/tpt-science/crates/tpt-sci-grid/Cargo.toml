[package]
name = "tpt-sci-grid"
description = "Structured finite-difference grids/stencils for the tpt-science pillar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-science"
homepage = "https://github.com/tpt-solutions/tpt-science"
readme = "README.md"
documentation = "https://docs.rs/tpt-sci-grid"
keywords = ["finite-difference", "pde", "grid", "science", "simulation"]
categories = ["science", "simulation", "mathematics"]
publish = false

[dependencies]
tpt-math-numeric = { version = "0.1.0" }
tpt-math-linalg = { version = "0.1.0" }
thiserror = { version = "2" }

[features]
# Opt-in sparse-matrix backend (`CsrMatrix`, `laplacian_*_sparse`). additive:
# the dense API is always available; enabling this unlocks memory-efficient
# operators for realistically-sized (N-D) PDE grids.
sparse = []

[dev-dependencies]
approx = { version = "0.5" }
criterion = { version = "0.5" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "allow" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "laplacian"
harness = false
