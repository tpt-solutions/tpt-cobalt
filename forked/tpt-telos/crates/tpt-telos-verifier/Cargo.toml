[package]
name = "tpt-telos-verifier"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-telos"
homepage = "https://github.com/tpt-solutions/tpt-telos"
readme = "README.md"
documentation = "https://docs.rs/tpt-telos-verifier"
keywords = ["smt", "solver", "verification", "formal-methods", "z3"]
categories = ["algorithms", "development-tools"]
description = "Self-contained SMT-style verifier (QF_LRA) for tpt-telos constraints"

[features]
default = []
z3 = ["dep:z3"]

[dependencies]
tpt-telos-ir = { path = "../tpt-telos-ir", version = "0.2.0" }
z3 = { version = "0.12", optional = true }

[dev-dependencies]
tpt-telos-parser = { path = "../tpt-telos-parser", version = "0.2.0" }
proptest = "1"
