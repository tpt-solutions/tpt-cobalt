[package]
name = "tpt-telos-agent"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-telos"
homepage = "https://github.com/tpt-solutions/tpt-telos"
readme = "README.md"
documentation = "https://docs.rs/tpt-telos-agent"
keywords = ["llm", "agent", "codegen", "transpiler", "telos"]
categories = ["compilers", "development-tools"]
description = "Agentic transpiler backend for tpt-telos (StaticAgent + LLM agent)"

[features]
# Enables the real LLM-backed agent (requires network + an API key at runtime).
llm = ["ureq", "serde_json"]

[dependencies]
tpt-telos-parser = { path = "../tpt-telos-parser", version = "0.2.0" }
tpt-telos-ir = { path = "../tpt-telos-ir", version = "0.2.0" }
tpt-telos-verifier = { path = "../tpt-telos-verifier", version = "0.2.0" }
tpt-telos-router = { path = "../tpt-telos-router", version = "0.2.0" }
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
