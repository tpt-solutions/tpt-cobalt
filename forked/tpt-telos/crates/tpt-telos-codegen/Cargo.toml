[package]
name = "tpt-telos-codegen"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-telos"
homepage = "https://github.com/tpt-solutions/tpt-telos"
readme = "README.md"
documentation = "https://docs.rs/tpt-telos-codegen"
keywords = ["codegen", "ffi", "transpiler", "rust-to-go", "telos"]
categories = ["compilers", "development-tools::ffi"]
description = "Rust/Go dual-backend code generation and FFI bridge for tpt-telos"

[dependencies]
tpt-telos-parser = { path = "../tpt-telos-parser", version = "0.2.0" }
tpt-telos-agent = { path = "../tpt-telos-agent", version = "0.2.0" }
tpt-telos-router = { path = "../tpt-telos-router", version = "0.2.0" }
sha2 = "0.10"

[dev-dependencies]
tpt-telos-ir = { path = "../tpt-telos-ir", version = "0.2.0" }
tpt-telos-verifier = { path = "../tpt-telos-verifier", version = "0.2.0" }
