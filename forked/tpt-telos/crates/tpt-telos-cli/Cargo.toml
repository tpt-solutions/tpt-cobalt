[package]
name = "tpt-telos"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-telos"
homepage = "https://github.com/tpt-solutions/tpt-telos"
documentation = "https://docs.rs/tpt-telos"
readme = "README.md"
keywords = ["cli", "compiler", "verification", "transpiler", "telos"]
categories = ["command-line-utilities", "compilers"]
description = "Command-line interface for the tpt-telos compiler"

[[bin]]
name = "telos"
path = "src/main.rs"

[dependencies]
tpt-telos-parser = { path = "../tpt-telos-parser", version = "0.2.0" }
tpt-telos-ir = { path = "../tpt-telos-ir", version = "0.2.0" }
tpt-telos-verifier = { path = "../tpt-telos-verifier", version = "0.2.0" }
tpt-telos-router = { path = "../tpt-telos-router", version = "0.2.0" }
tpt-telos-agent = { path = "../tpt-telos-agent", version = "0.2.0" }
tpt-telos-codegen = { path = "../tpt-telos-codegen", version = "0.2.0" }
tpt-telos-lsp = { path = "../tpt-telos-lsp", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enables the `telos transpile --llm` / `build --llm` real LLM backend.
llm = ["tpt-telos-agent/llm"]
# Enables the `--solver z3` option for exact nonlinear arithmetic.
z3 = ["tpt-telos-verifier/z3"]

[dev-dependencies]
serde_json = "1"
