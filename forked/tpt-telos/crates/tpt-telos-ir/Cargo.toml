[package]
name = "tpt-telos-ir"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-telos"
homepage = "https://github.com/tpt-solutions/tpt-telos"
readme = "README.md"
documentation = "https://docs.rs/tpt-telos-ir"
keywords = ["ir", "constraint-solving", "smt", "compiler", "telos"]
categories = ["compilers", "development-tools"]
description = "Intermediate representation and constraint extraction for tpt-telos"

[dependencies]
tpt-telos-parser = { path = "../tpt-telos-parser", version = "0.2.0" }

[dev-dependencies]
proptest = "1"
