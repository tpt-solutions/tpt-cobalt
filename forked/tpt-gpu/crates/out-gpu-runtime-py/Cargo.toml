[package]
name = "out-gpu-runtime-py"
version = "0.1.0"
edition = "2021"
authors = ["TPT Solutions"]
description = "TPT Runtime - Python bindings via PyO3"
license = "MIT OR Apache-2.0 WITH LLVM-exception"
publish = false

[lib]
crate-type = ["cdylib"]
name = "tptr"

[dependencies]
tpt-gpu-runtime = { path = "../tpt-gpu-runtime" }
pyo3 = { version = "0.29", features = ["extension-module"] }
