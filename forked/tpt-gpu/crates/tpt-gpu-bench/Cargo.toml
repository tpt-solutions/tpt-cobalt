[package]
name = "tpt-gpu-bench"
version = "0.1.0"
edition = "2021"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0 WITH LLVM-exception"
description = "User-runnable dynamic benchmark suite for TPT GPU kernels"
repository = "https://github.com/tpt-solutions/tpt-gpu"
documentation = "https://docs.rs/tpt-gpu-bench"
readme = "README.md"
keywords = ["gpu", "benchmarking", "kernels", "performance", "hpc"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tpt-gpu-bench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = { version = "1" }
chrono = { version = "0.4", features = ["serde"] }
toml = { version = "1.1" }
