[package]
name = "tpt-math-interpolate"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "In-house interpolation & approximation for the tpt-math substrate: RBF, ordinary Kriging, PCHIP, and B-spline basis evaluation for scattered data and surrogates. Built on tpt-math-linalg-dense storage. no_std + alloc."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-interpolate"
keywords = ["interpolation", "rbf", "kriging", "pchip", "b-spline"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-linalg-dense = { path = "../tpt-math-linalg-dense", version = "0.1.0", default-features = false }
tpt-math-numeric = { path = "../tpt-math-numeric", version = "0.1.0", default-features = false }

[dev-dependencies]
approx = "0.5"

[features]
default = ["std"]
std = ["tpt-math-linalg-dense/std", "tpt-math-numeric/std", "alloc"]
alloc = ["tpt-math-linalg-dense/alloc", "tpt-math-numeric/alloc"]

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
