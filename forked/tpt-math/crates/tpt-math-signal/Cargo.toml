[package]
name = "tpt-math-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Umbrella: re-exports fft+filter."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-signal"
keywords = ["signal-processing", "umbrella", "fft", "filters", "dsp"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-signal-filter = { path = "../tpt-math-signal-filter", version = "0.1.0", optional = true }
tpt-math-signal-fft = { path = "../tpt-math-signal-fft", version = "0.1.0", optional = true }

[features]
default = ["tpt-math-signal-filter", "tpt-math-signal-fft"]
tpt-math-signal-filter = ["dep:tpt-math-signal-filter"]
tpt-math-signal-fft = ["dep:tpt-math-signal-fft"]


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
