[package]
name = "tpt-math-signal-filter"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "FIR/IIR filters, windowing."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-signal-filter"
keywords = ["filters", "fir", "iir", "windowing", "signal-processing"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-numeric = { path = "../tpt-math-numeric", version = "0.1.0", default-features = false, features = ["std"] }
tpt-math-signal-fft = { path = "../tpt-math-signal-fft", version = "0.1.0" }

[features]
default = []


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
