[package]
name = "tpt-math-prob-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Shared Distribution/Sampler traits."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-prob-core"
keywords = ["probability", "statistics", "traits", "distribution", "sampling"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-numeric = { path = "../tpt-math-numeric", version = "0.1.0", default-features = false }

[features]
default = ["std"]
std = ["tpt-math-numeric/std"]
alloc = ["tpt-math-numeric/alloc"]


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
