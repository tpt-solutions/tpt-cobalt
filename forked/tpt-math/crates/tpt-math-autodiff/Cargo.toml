[package]
name = "tpt-math-autodiff"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Umbrella: re-exports fwd+rev."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-autodiff"
keywords = ["autodiff", "gradients", "umbrella", "differentiation", "reverse-mode"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-autodiff-fwd = { path = "../tpt-math-autodiff-fwd", version = "0.1.0", optional = true }
tpt-math-autodiff-rev = { path = "../tpt-math-autodiff-rev", version = "0.1.0", optional = true }

[features]
default = ["tpt-math-autodiff-fwd", "tpt-math-autodiff-rev"]
tpt-math-autodiff-fwd = ["dep:tpt-math-autodiff-fwd"]
tpt-math-autodiff-rev = ["dep:tpt-math-autodiff-rev"]


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
