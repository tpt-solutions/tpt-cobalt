[package]
name = "tpt-math-autodiff-rev"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Reverse-mode / tape autodiff."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-autodiff-rev"
keywords = ["autodiff", "reverse-mode", "gradients", "tape", "differentiation"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-autodiff-fwd = { path = "../tpt-math-autodiff-fwd", version = "0.1.0" }

[features]
default = ["std"]
# The tape needs an allocator and `f64` transcendentals, so this crate is
# std-only for now; the feature exists for consistency with the sibling
# autodiff crates.
std = ["tpt-math-autodiff-fwd/std"]


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
