[package]
name = "tpt-math-spatial"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Spatial (Featherstone) kinematics for the tpt-math substrate: 6-D spatial vectors, dual quaternions and screw theory. In-house, no compliant-license wrap target. Built on tpt-math-geometry / tpt-math-linalg-fixed. No allocator."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-spatial"
keywords = ["spatial", "featherstone", "screw", "dual-quaternion", "kinematics"]
categories = ["mathematics", "science", "no-std"]

[dependencies]
tpt-math-geometry = { path = "../tpt-math-geometry", version = "0.1.1", default-features = false }
tpt-math-linalg-fixed = { path = "../tpt-math-linalg-fixed", version = "0.1.0", default-features = false }
tpt-math-numeric = { path = "../tpt-math-numeric", version = "0.1.0", default-features = false }

[features]
default = ["std"]
std = [
    "tpt-math-geometry/std",
    "tpt-math-linalg-fixed/std",
    "tpt-math-numeric/std",
]
alloc = [
    "tpt-math-geometry/alloc",
    "tpt-math-linalg-fixed/alloc",
    "tpt-math-numeric/alloc",
]

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
