[package]
name = "tpt-math-stats"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Hypothesis tests / regression (in-house distributions & special functions, no statrs)"
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-stats"
keywords = ["statistics", "hypothesis-testing", "regression", "stats", "analysis"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-prob-core = { path = "../tpt-math-prob-core", version = "0.1.0", default-features = false, features = ["std"] }

[features]
default = []


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
