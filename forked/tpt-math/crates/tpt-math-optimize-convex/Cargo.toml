[package]
name = "tpt-math-optimize-convex"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Convex / QP optimization (in-house dense primal-dual interior-point solver)."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-optimize-convex"
keywords = ["convex-optimization", "qp", "solvers", "interior-point", "quadratic"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-linalg = { path = "../tpt-math-linalg", version = "0.1.0" }
tpt-math-linalg-dense = { path = "../tpt-math-linalg-dense", version = "0.1.0", default-features = false }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "optimize_convex_bench"
harness = false

[features]
default = []


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
