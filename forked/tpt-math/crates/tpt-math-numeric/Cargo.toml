[package]
name = "tpt-math-numeric"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Scalar numeric trait glue (wrap num-traits + libm)."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-numeric"
keywords = ["numeric", "traits", "scalar", "no-std", "math"]
categories = ["mathematics", "algorithms", "no-std"]

[dependencies]
libm = { version = "0.2.16", optional = true }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }

[features]
default = ["std"]
std = ["num-traits/std"]
alloc = []
libm = ["dep:libm"]


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
