[package]
name = "tpt-math-units-dyn"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Runtime dimension-checked units for dynamic/config payloads."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-units-dyn"
keywords = ["units", "dimensional-analysis", "runtime", "type-safe", "physics"]
categories = ["mathematics", "science", "data-structures"]


[dependencies]
tpt-math-units = { path = "../tpt-math-units", version = "0.1.0", default-features = false, features = ["std"] }

[features]
default = []


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
