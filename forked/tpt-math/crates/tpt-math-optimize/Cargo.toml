[package]
name = "tpt-math-optimize"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Umbrella: re-exports general+convex."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-optimize"
keywords = ["optimization", "umbrella", "solvers", "convex", "numerical"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-optimize-general = { path = "../tpt-math-optimize-general", version = "0.1.0", optional = true }
tpt-math-optimize-convex = { path = "../tpt-math-optimize-convex", version = "0.1.0", optional = true }

[features]
default = ["tpt-math-optimize-general", "tpt-math-optimize-convex"]
tpt-math-optimize-general = ["dep:tpt-math-optimize-general"]
tpt-math-optimize-convex = ["dep:tpt-math-optimize-convex"]


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
