[package]
name = "tpt-math-optimize-general"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "General numerical optimization (in-house steepest descent, nonlinear conjugate gradient, Newton)."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-optimize-general"
keywords = ["optimization", "solvers", "algorithms", "numerical"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-linalg = { path = "../tpt-math-linalg", version = "0.1.0" }
tpt-math-linalg-dense = { path = "../tpt-math-linalg-dense", version = "0.1.0", default-features = false }

[features]
default = []

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }
