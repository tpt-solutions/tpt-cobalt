[package]
name = "tpt-math-signal-fft"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "FFT (wrap rustfft)."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-math"
homepage = "https://github.com/tpt-solutions/tpt-math"
documentation = "https://docs.rs/tpt-math-signal-fft"
keywords = ["fft", "dft", "fourier", "signal-processing", "spectral"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
rustfft = "6.4.1"
tpt-math-numeric = { path = "../tpt-math-numeric", version = "0.1.0", default-features = false, features = ["std"] }

[features]
default = []


[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "signal_fft_bench"
harness = false
