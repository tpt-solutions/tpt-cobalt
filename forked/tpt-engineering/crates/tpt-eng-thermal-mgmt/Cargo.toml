[package]
name = "tpt-eng-thermal-mgmt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Heat sink sizing, fan curves, thermal resistance networks."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
keywords = ["engineering", "thermal", "heat-sink", "cooling", "electronics"]
categories = ["science", "algorithms"]

[dependencies]
tpt-eng-heat-transfer = { path = "../tpt-eng-heat-transfer", version = "0.1.0" }
tpt-eng-props-air = { path = "../tpt-eng-props-air", version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
