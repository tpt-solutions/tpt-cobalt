[package]
name = "tpt-eng-mesh"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-engineering"
authors = ["TPT Solutions"]
rust-version = "1.85"
description = "Mesh representation, normals, quality metrics, refinement/repair, and format-conversion hooks"
readme = "README.md"
keywords = ["mesh", "cad", "engineering", "geometry", "stl"]
categories = ["science", "graphics"]

[dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tpt-eng-geometry = { path = "../tpt-eng-geometry", version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
