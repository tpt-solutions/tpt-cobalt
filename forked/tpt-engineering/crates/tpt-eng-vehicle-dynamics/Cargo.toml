[package]
name = "tpt-eng-vehicle-dynamics"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Tire models (Pacejka), aerodynamic drag, suspension kinematics."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
keywords = ["engineering", "vehicle-dynamics", "tire", "aerodynamics", "suspension"]
categories = ["science", "algorithms", "simulation"]

[dependencies]
tpt-eng-geometry = { path = "../tpt-eng-geometry", version = "0.1.0" }
tpt-eng-structural = { path = "../tpt-eng-structural", version = "0.1.0" }
tpt-math-linalg = { version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
