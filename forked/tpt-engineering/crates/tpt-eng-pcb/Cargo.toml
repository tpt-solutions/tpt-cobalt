[package]
name = "tpt-eng-pcb"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "PCB layer stackup, trace routing primitives, via/footprint definitions."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
keywords = ["engineering", "pcb", "electronics", "trace", "layout"]
categories = ["hardware-support", "science"]

[dependencies]
tpt-eng-electrical = { path = "../tpt-eng-electrical", version = "0.1.0" }
tpt-eng-materials = { path = "../tpt-eng-materials", version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
