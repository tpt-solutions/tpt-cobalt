[package]
name = "tpt-eng-timeseries-gap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Staleness/gap detection and interpolation for sensor dropouts."
readme = "README.md"
keywords = ["engineering", "timeseries", "interpolation", "sensors", "data"]
categories = ["science", "algorithms", "data-structures"]
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"

[dependencies]
tpt-eng-timeseries-core = { path = "../tpt-eng-timeseries-core", version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
