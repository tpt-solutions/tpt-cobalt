[package]
name = "tpt-eng-geotech"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Soil constitutive models, borehole stratigraphy."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
keywords = ["engineering", "geotechnical", "soil", "mohr-coulomb", "stratigraphy"]
