[package]
name = "tpt-eng-crystallography"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Miller indices, slip systems, crystal symmetry operations."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
keywords = ["engineering", "crystallography", "miller-indices", "materials", "slip-systems"]
