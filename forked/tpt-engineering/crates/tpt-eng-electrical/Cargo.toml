[package]
name = "tpt-eng-electrical"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Impedance/reactance, per-unit systems, three-phase power, conductor/insulator property lookups."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
keywords = ["engineering", "electrical", "impedance", "power-systems", "three-phase"]
categories = ["science", "algorithms"]

[dependencies]
tpt-math-units = { version = "0.1.0" }
tpt-math-numeric = { version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
