[package]
name = "tpt-eng-safety"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-engineering"
authors = ["TPT Solutions"]
description = "Safety margins and limit-state evaluation: utilization, margins, pass/fail, safety factors."
keywords = ["safety", "engineering", "limit-state", "utilization", "margin"]
categories = ["science", "algorithms"]

[dependencies]
tpt-eng-reliability = { path = "../tpt-eng-reliability", version = "0.1.0" }
thiserror = { version = "2" }
serde = { version = "1", features = ["derive"] }
tpt-math-units = { version = "0.1.0" }

[dev-dependencies]
approx = { version = "0.5" }
rand = { version = "0.10" }
tpt-eng-tolerance = { path = "../tpt-eng-tolerance", version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
