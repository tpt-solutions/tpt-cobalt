[package]
name = "tpt-eng-geometry"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-engineering"
authors = ["TPT Solutions"]
rust-version = "1.85"
description = "Core geometry primitives, frames, transforms, curves, surfaces, intersections, projections, and engineering geometry queries"
readme = "README.md"
keywords = ["geometry", "cad", "engineering", "3d", "primitives"]
categories = ["science", "mathematics", "graphics"]

[dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
