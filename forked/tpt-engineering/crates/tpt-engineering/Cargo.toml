[package]
name = "tpt-engineering"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Umbrella meta-crate re-exporting the tpt-eng-* engineering primitives behind per-crate feature flags"
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
publish = false

[dependencies]
tpt-eng-props-water = { path = "../tpt-eng-props-water", version = "0.1.0", optional = true }
tpt-eng-props-air = { path = "../tpt-eng-props-air", version = "0.1.0", optional = true }
tpt-eng-props-fuels = { path = "../tpt-eng-props-fuels", version = "0.1.0", optional = true }
