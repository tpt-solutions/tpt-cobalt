tpt-eng-timeseries-gap = { path = "../tpt-eng-timeseries-gap", version = "0.1.0", optional = true }
tpt-eng-timeseries = { path = "../tpt-eng-timeseries", version = "0.1.0", optional = true }
tpt-eng-geo-asset = { path = "../tpt-eng-geo-asset", version = "0.1.0", optional = true }
