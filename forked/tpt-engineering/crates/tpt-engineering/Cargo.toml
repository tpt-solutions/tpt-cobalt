tpt-eng-materials = { path = "../tpt-eng-materials", version = "0.1.0", optional = true }
tpt-eng-sections = { path = "../tpt-eng-sections", version = "0.1.0", optional = true }
tpt-eng-standards = { path = "../tpt-eng-standards", version = "0.1.0", optional = true }
tpt-eng-geometry = { path = "../tpt-eng-geometry", version = "0.1.0", optional = true }
tpt-eng-mesh = { path = "../tpt-eng-mesh", version = "0.1.0", optional = true }
tpt-eng-nurbs = { path = "../tpt-eng-nurbs", version = "0.1.0", optional = true }
tpt-eng-gdt = { path = "../tpt-eng-gdt", version = "0.1.0", optional = true }
