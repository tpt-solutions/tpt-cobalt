geo-asset = ["tpt-eng-geo-asset"]
geo-topology = ["tpt-eng-geo-topology"]
network-matrix = ["tpt-eng-network-matrix"]
controls = ["tpt-eng-controls"]
structural = ["tpt-eng-structural"]
materials = ["tpt-eng-materials"]
sections = ["tpt-eng-sections"]
standards = ["tpt-eng-standards"]
geometry = ["tpt-eng-geometry"]
mesh = ["tpt-eng-mesh"]
nurbs = ["tpt-eng-nurbs"]
gdt = ["tpt-eng-gdt"]
cad = ["tpt-eng-cad"]
tolerance = ["tpt-eng-tolerance"]
reliability = ["tpt-eng-reliability"]
safety = ["tpt-eng-safety"]
io = ["tpt-eng-io"]
report = ["tpt-eng-report"]
plot = ["tpt-eng-plot"]
examples = ["tpt-eng-examples"]
electrical = ["tpt-eng-electrical"]
heat-transfer = ["tpt-eng-heat-transfer"]
props-mixture = ["tpt-eng-props-mixture"]
pcb = ["tpt-eng-pcb"]
thermal-mgmt = ["tpt-eng-thermal-mgmt"]
power-components = ["tpt-eng-power-components"]
renewables = ["tpt-eng-renewables"]
vehicle-dynamics = ["tpt-eng-vehicle-dynamics"]
