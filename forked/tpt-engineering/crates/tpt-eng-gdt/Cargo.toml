[package]
name = "tpt-eng-gdt"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-engineering"
authors = ["TPT Solutions"]
rust-version = "1.85"
description = "Geometric dimensioning and tolerancing: datums, tolerance frames, tolerance zones, fits, allowances, stack-up inputs"
readme = "README.md"
keywords = ["gdt", "tolerance", "datum", "engineering", "manufacturing"]
categories = ["science", "mathematics"]

[dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tpt-eng-geometry = { path = "../tpt-eng-geometry", version = "0.1.0" }
tpt-eng-tolerance = { path = "../tpt-eng-tolerance", version = "0.1.0" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
