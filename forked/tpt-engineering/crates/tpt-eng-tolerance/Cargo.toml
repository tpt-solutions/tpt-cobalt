[package]
name = "tpt-eng-tolerance"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-engineering"
authors = ["TPT Solutions"]
description = "Tolerance analysis: worst-case, RSS, and Monte Carlo stack-up, sensitivity, and ranking."
keywords = ["engineering", "tolerance", "stack-up", "gdt", "analysis"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
tpt-math-stats = { version = "0.1.0" }
rand = { version = "0.10" }
rand_distr.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = { version = "0.5" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
