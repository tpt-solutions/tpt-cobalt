[package]
name = "tpt-eng-materials"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-engineering"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
keywords = ["engineering", "materials", "material-properties", "thermodynamics", "data"]
categories = ["science", "data-structures"]
description = "Material property modeling with source tracking, temperature dependence, anisotropic hooks, and original/openly-licensed data only."
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
csv = { version = "1" }

[lints]
rust = { unsafe_op_in_unsafe_fn = "warn", unsafe_code = "forbid" }
clippy = { all = "warn", missing_errors_doc = "warn", missing_panics_doc = "warn" }
