[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions <contact@tpt.solutions>"]
repository = "https://github.com/tpt-solutions/tpt-crucible"
description = "tpt-engineering — applied engineering primitives for the TPT Solutions physical-systems verticals"
homepage = "https://github.com/tpt-solutions/tpt-engineering"
readme = "README.md"
documentation = "https://docs.rs/tpt-telos"
keywords = ["verification", "compiler", "transpiler", "smt", "formal-methods"]
categories = ["compilers", "development-tools", "command-line-utilities"]

[workspace.dependencies]
tpt-tensor = { path = "crates/tpt-tensor" }
tpt-lang = { path = "crates/tpt-lang" }
tpt-autograd = { path = "crates/tpt-autograd" }
tpt-ml = { path = "crates/tpt-ml" }
tpt-hub = { path = "crates/tpt-hub" }
tpt-runtime = { path = "crates/tpt-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
pyo3 = { version = "0.24", features = ["extension-module"] }
tracing-subscriber = "0.3"
melior = "0.15"
sha2 = "0.10"
zip = "2"
tpt-math-units = "0.1.0"
